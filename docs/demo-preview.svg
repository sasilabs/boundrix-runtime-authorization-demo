<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <style>
    .terminal-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94A3B8; font-weight: 600; }
    .code-text { font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace; font-size: 12.5px; fill: #E2E8F0; }
    .cyan { fill: #38BDF8; font-weight: bold; }
    .green { fill: #34D399; font-weight: bold; }
    .red { fill: #F87171; font-weight: bold; }
    .yellow { fill: #FBBF24; font-weight: bold; }
    .dim { fill: #64748B; }
    .white { fill: #F8FAFC; font-weight: bold; }
  </style>

  <!-- Terminal Window Background -->
  <rect x="0" y="0" width="960" height="520" rx="14" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="2" />

  <!-- Window Header Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 946 0 Q 960 0 960 14 L 960 40 L 0 40 Z" fill="#161E2E" />
  <line x1="0" y1="40" x2="960" y2="40" stroke="#1E293B" stroke-width="1.5" />

  <!-- Window Controls -->
  <circle cx="24" cy="20" r="6" fill="#EF4444" />
  <circle cx="44" cy="20" r="6" fill="#F59E0B" />
  <circle cx="64" cy="20" r="6" fill="#10B981" />
  <text x="480" y="25" text-anchor="middle" class="terminal-title">boundrix-runtime-authorization-demo — python3 -m src.demo</text>

  <!-- Terminal Content -->
  <g transform="translate(35, 72)">
    <!-- Header -->
    <text x="0" y="0" class="code-text cyan">$ python3 -m src.demo</text>
    <text x="0" y="24" class="code-text white">BOUNDRIX RUNTIME AUTHORIZATION ENGINE</text>
    <text x="0" y="44" class="code-text dim">Task: "Fix token bug in auth-service"  |  Delegator: developer-01  |  Agent: coding-agent-01</text>
    <text x="0" y="60" class="code-text dim">-------------------------------------------------------------------------------------------------</text>

    <!-- Execution Sequence with perfectly spaced columns:
         Col 1 (Decision): x = 0
         Col 2 (Action):   x = 90
         Col 3 (Resource): x = 230
         Col 4 (Result):   x = 550
    -->
    <text x="0" y="86" class="code-text green">✔  ALLOW</text>
    <text x="90" y="86" class="code-text white">read</text>
    <text x="230" y="86" class="code-text cyan">github://acme/auth-service</text>
    <text x="550" y="86" class="code-text dim">[bugfix/token-expiration]  &lt; 0.1ms</text>

    <text x="0" y="116" class="code-text green">✔  ALLOW</text>
    <text x="90" y="116" class="code-text white">modify</text>
    <text x="230" y="116" class="code-text cyan">github://acme/auth-service</text>
    <text x="550" y="116" class="code-text dim">[bugfix/token-expiration]  &lt; 0.1ms</text>

    <text x="0" y="146" class="code-text green">✔  ALLOW</text>
    <text x="90" y="146" class="code-text white">create_pr</text>
    <text x="230" y="146" class="code-text cyan">github://acme/auth-service</text>
    <text x="550" y="146" class="code-text dim">[bugfix/token-expiration]  &lt; 0.1ms</text>

    <text x="0" y="180" class="code-text red">✖  DENY</text>
    <text x="90" y="180" class="code-text white">modify</text>
    <text x="230" y="180" class="code-text red">github://acme/billing-service</text>
    <text x="550" y="180" class="code-text yellow">DENIED: Outside delegated task scope</text>

    <text x="0" y="210" class="code-text red">✖  DENY</text>
    <text x="90" y="210" class="code-text white">delete_branch</text>
    <text x="230" y="210" class="code-text red">github://acme/auth-service [main]</text>
    <text x="550" y="210" class="code-text yellow">DENIED: Branch outside authority</text>

    <text x="0" y="240" class="code-text red">✖  DENY</text>
    <text x="90" y="240" class="code-text white">modify_iam</text>
    <text x="230" y="240" class="code-text red">iam://production</text>
    <text x="550" y="240" class="code-text yellow">DENIED: IAM outside task authority</text>

    <!-- Mid-Task Revocation Event -->
    <text x="0" y="275" class="code-text dim">-------------------------------------------------------------------------------------------------</text>
    <text x="0" y="298" class="code-text yellow">⚡ EVENT: Developer revokes task mid-run ➔ Authorization State: REVOKED</text>
    <text x="0" y="322" class="code-text dim">-------------------------------------------------------------------------------------------------</text>

    <text x="0" y="352" class="code-text red">✖  DENY</text>
    <text x="90" y="352" class="code-text white">create_pr</text>
    <text x="230" y="352" class="code-text cyan">github://acme/auth-service</text>
    <text x="550" y="352" class="code-text red">DENIED: Task authorization has been revoked</text>

    <text x="0" y="392" class="code-text dim">✔ 11/11 decisions recorded to audit.jsonl (Flight Recorder)</text>
  </g>
</svg>
